# dsh-desktop: pin the directory-picker seam to the reliable `browse`
# interaction instead of the native Win32 dialog worker.
#
# The native picker (dsh-host-directory-picker-native) drives IFileOpenDialog
# through a spawned koffi worker whose result-path extraction
# (worker.cjs readUtf16 -> koffi.view) can crash the worker process on
# packaged Electron, surfacing as "win32 folder dialog worker exited before
# reporting a result". The browse interaction is pure JavaScript (in-app
# directory browser) and works everywhere.
#
# Verified against @deepseek-ai/dsh-web-app 0.1.5-rc.3: its cordis.patch.yml
# still mounts this seam as row id `directory-picker`
# (name `@deepseek-ai/dsh-host-directory-picker-auto`), and both browse packages
# below still exist at that version.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse-host
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-browse-client
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
