<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<title>DeepSeek Harness 设置</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2328;
    --text-2: #656d76;
    --accent: #3b82f6;
    --accent-text: #ffffff;
    --ok: #1a7f37;
    --warn: #9a6700;
    --err: #cf222e;
  }
  [data-dark] {
    color-scheme: dark;
    --bg: #16181d;
    --card: #21242b;
    --border: #333844;
    --text: #e6e8ec;
    --text-2: #9aa1ad;
    --accent: #4f8cff;
    --accent-text: #ffffff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  h1 { font-size: 15px; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--text); }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .row label { flex: 1; color: var(--text-2); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .hint { color: var(--text-2); font-size: 11px; margin-top: 4px; }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  button.primary:hover { opacity: 0.9; color: var(--accent-text); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .ver-row { display: flex; align-items: center; gap: 10px; }
  .ver { font-family: Consolas, monospace; color: var(--text-2); }
  #update-status { margin-top: 10px; font-size: 12px; min-height: 18px; }
  #update-status.ok { color: var(--ok); }
  #update-status.warn { color: var(--warn); }
  #update-status.err { color: var(--err); }
  .progress {
    margin-top: 8px;
    height: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    display: none;
  }
  .progress.show { display: block; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
</style>
</head>
<body>
<h1>设置</h1>

<div class="card">
  <h2>常规</h2>
  <div class="row">
    <label for="launch">开机自动启动</label>
    <input type="checkbox" id="launch">
  </div>
  <div class="row">
    <label for="close">关闭窗口时最小化到托盘</label>
    <input type="checkbox" id="close">
  </div>
</div>

<div class="card">
  <h2>GitHub 代理(用于在线升级)</h2>
  <input type="text" id="proxy" placeholder="http://127.0.0.1:7890(留空为直连)">
  <div class="hint">升级包从 GitHub Releases 下载;网络受限时可配置本地代理(Clash / v2ray 等)地址。</div>
  <div class="row" style="justify-content: flex-end;">
    <button id="save">保存设置</button>
  </div>
</div>

<div class="card">
  <h2>检查更新</h2>
  <div class="ver-row">
    <span>当前版本</span>
    <span class="ver" id="cur-ver">-</span>
    <button id="check" class="primary">检查更新</button>
  </div>
  <div id="update-status"></div>
  <div class="progress" id="progress"><div id="progress-bar"></div></div>
  <div id="install-row" style="display:none; margin-top:10px;">
    <button id="install" class="primary">立即重启安装</button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const dsh = window.dshSettings;

  const PHASE_TEXT = {
    idle: "",
    checking: "正在检查更新…",
    "not-available": "当前已是最新版本",
    available: "发现新版本,开始下载…",
    downloading: "正在下载更新…",
    downloaded: "更新已下载完成",
    error: "检查更新失败",
  };

  let state = { phase: "idle" };

  function render(stateData) {
    state = stateData || state;
    const el = $("update-status");
    el.className = "";
    const text = PHASE_TEXT[state.phase] || state.phase || "";
    if (state.phase === "error") {
      el.className = "err";
      el.textContent = text + (state.message ? ": " + state.message : "");
    } else if (state.phase === "downloading") {
      el.className = "warn";
      el.textContent = text + " " + (state.percent || 0) + "%";
      const bar = $("progress");
      bar.classList.add("show");
      $("progress-bar").style.width = (state.percent || 0) + "%";
    } else {
      el.className = state.phase === "not-available" || state.phase === "downloaded" ? "ok" : "";
      el.textContent = text + (state.version ? " " + state.version : "");
      if (state.phase !== "downloading") $("progress").classList.remove("show");
    }
    $("install-row").style.display = state.phase === "downloaded" ? "block" : "none";
    $("check").disabled = state.phase === "checking" || state.phase === "downloading";
  }

  async function load() {
    const settings = await dsh.get();
    $("launch").checked = settings.launchAtLogin;
    $("close").checked = settings.closeToTray;
    $("proxy").value = settings.githubProxy || "";
    $("cur-ver").textContent = await dsh.version();
  }

  $("save").addEventListener("click", async () => {
    await dsh.set({
      launchAtLogin: $("launch").checked,
      closeToTray: $("close").checked,
      githubProxy: $("proxy").value.trim(),
    });
    const s = $("update-status");
    s.className = "ok";
    s.textContent = "已保存";
  });

  $("check").addEventListener("click", async () => {
    render(await dsh.checkUpdate());
  });

  $("install").addEventListener("click", async () => {
    await dsh.installUpdate();
  });

  dsh.onUpdateState(render);
  load();
</script>
</body>
</html>
